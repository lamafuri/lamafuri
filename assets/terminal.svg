  <text x="28" y="152" class="out" style="animation-delay:3.4s">  <tspan class="key">"Role"</tspan>:          <tspan class="str">"Aspiring DevOps &amp; Cloud Engineer"</tspan>,</text>
  <text x="28" y="176" class="out" style="animation-delay:3.55s">  <tspan class="key">"Certification"</tspan>: <tspan class="str">"AWS Certified Solutions Architect – Associate"</tspan>,</text>
