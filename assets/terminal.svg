<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="t" xml:space="preserve">
  <title id="t">Terminal: aws sts get-caller-identity returns Furi Sherpa Lama, Aspiring DevOps and Cloud Engineer, AWS Certified Solutions Architect – Associate, Kathmandu, Nepal, open to work</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
    .muted { fill: #8b949e; font-size: 13px; }
    .prompt { fill: #3fb950; font-weight: 600; }
    .key { fill: #79c0ff; }
    .str { fill: #a5d6ff; }
    .ok { fill: #3fb950; }
    .cover, .cur1 { animation: type 2.2s steps(27, end) .6s forwards; }
    .cur1 { animation: type 2.2s steps(27, end) .6s forwards, hide .01s 3s forwards; }
    .out { opacity: 0; animation: show .01s forwards; }
    .cur2 { opacity: 0; animation: blink 1s steps(1) 4.3s infinite; }
    @keyframes type { to { transform: translateX(243px); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes hide { to { opacity: 0; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cover, .cur1 { display: none; }
      .out { opacity: 1; animation: none; }
      .cur2 { opacity: 1; animation: none; }
    }
  </style>

  <rect x="1" y="1" width="818" height="298" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h794a12 12 0 0 1 12 12v27H1z" fill="#161b22"/>
